---
- name: Setup zwbak user and backup environment
  hosts: all
  become: yes

  vars:
    zwbak_user: zwbak
    public_key: "ssh-rsa  zwbak@zwbak"  

  tasks:

    - name: Create user zwbak
      ansible.builtin.user:
        name: "{{ zwbak_user }}"
        shell: /bin/bash
        create_home: yes

    - name: Add SSH public key for zwbak
      ansible.builtin.authorized_key:
        user: "{{ zwbak_user }}"
        key: "{{ public_key }}"
    - name: Install required packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - bzip2
        - python3-pymysql
        - tmpreaper 

    - name: Create /wwwdata directory
      ansible.builtin.file:
        path: /wwwdata
        state: directory
        owner: "{{ zwbak_user }}"
        group: "{{ zwbak_user }}"

    - name: Copy mysql-backup cron job
      ansible.builtin.copy:
        src: /home/surba/Documents/Projects/ZWEBB/zwbak/mysql-backup
        dest: /etc/cron.d/mysql-backup
        owner: root
        group: root


    - name: Copy backup-script cron job
      ansible.builtin.copy:
        src: /home/surba/Documents/Projects/ZWEBB/zwbak/backup-script
        dest: /etc/cron.d/backup-script
        owner: root
        group: root

    - name: Copy /zw directory to server
      ansible.builtin.copy:
        src: /home/surba/Documents/Projects/ZWEBB/zwbak/zw/
        dest: /zw/
        owner: "{{ zwbak_user }}"
        group: "{{ zwbak_user }}"
    - name: Make backup scripts executable
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0755'
      loop:
            - /zw/bin/mysql-backup
            - /zw/bin/backup-script
    - name: Create MySQL backup user
      community.mysql.mysql_user:
        name: "{{ mysql_backup_user }}"
        password: "{{ mysql_backup_password }}"
        priv: "*.*:SELECT,SHOW VIEW,LOCK TABLES,EXECUTE"
        host: "localhost"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
    
